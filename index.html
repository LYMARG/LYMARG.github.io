<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你被骗了！</title>
  <style>
    /* 隐藏所有边距，让视频全屏显示 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000; /* 深色背景，视频边缘更和谐 */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;      /* 防止出现滚动条 */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* 视频容器：全屏居中，保持视频比例 */
    .video-container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;       /* 暗示可以点击 */
    }

    /* 视频元素本身：适应容器，保持宽高比，并循环播放 */
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;   /* 视频完整显示，不裁剪，留黑边 */
      background-color: #000;
      display: block;
    }
  </style>
</head>
<body>
  <div class="video-container" id="videoContainer">
    <!-- 
      视频标签：
      - 使用相对路径 "nppl.mp4" 即根目录下的文件
      - autoplay + loop + muted 保证自动循环播放
      - playsinline 针对移动端内联播放
      - 没有 controls 属性，所以不会显示原生控件
      - 点击视频本身切换播放/暂停（通过 JavaScript 实现）
    -->
    <video 
      id="bgVideo"
      src="nppl.mp4"
      autoplay 
      loop 
      muted 
      playsinline
      preload="auto"
    >
      您的浏览器不支持 HTML5 视频播放，请升级浏览器。
    </video>
  </div>

  <script>
    (function() {
      const video = document.getElementById('bgVideo');
      const container = document.getElementById('videoContainer');

      // 点击视频容器（或视频本身）切换播放/暂停
      // 使用容器监听，确保点击黑边区域也能触发
      container.addEventListener('click', function() {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      });

      // 确保自动播放（muted 下通常没问题，但以防万一）
      video.addEventListener('canplay', function() {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            // 自动播放被阻止，此时不会做额外提示（因为不需要显示）
            // 但用户点击即可播放
            console.warn('自动播放被阻止，点击画面即可播放。', error);
          });
        }
      });

      // 视频加载失败处理（静默处理或控制台报错，不影响界面）
      video.addEventListener('error', function(e) {
        console.error('视频加载失败:', video.error);
        // 不需要在界面上显示任何错误信息，因为要求“只允许控制开始和暂停，右下角不要显示”
        // 所以保持界面干净
      });
    })();
  </script>
</body>
</html>
