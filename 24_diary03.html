    <div class="title">回声 · 旧报纸</div>
    <div class="date">2023年9月5日 · 多云</div>

    <p>我找到了第二篇报道。</p>
    <p>2016年，一个叫 <span class="hl">周明</span> 的研究员失踪。他也是声学专业。他当时在做一个叫 <span class="warn">"声音留存"</span> 的项目。</p>
    <p>我对比了一下：陈远（2009），周明（2016），间隔七年。</p>
    <div class="quote">"七年。同一个地方。同一种声音。"</div>
    <p>我开始觉得这不是巧合。这是一个规律。</p>
    <p>我在笔记本上画了一条时间线。下一个会是谁？</p>
