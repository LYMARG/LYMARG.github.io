    <div class="header"><span>— 04 —</span><span>第 4 页</span></div>
    <div class="title">回声 · 回声</div>
    <div class="date">2023年9月8日 · 晴</div>

    <p>我找到了第三个名字。</p>
    <p>2020年，<span class="hl">方琳</span> 失踪。她是 <span class="warn">"回声计划"</span> 最后一位已知的研究员。</p>
    <p>三篇报道，三个人，三个年份。都在北郊研究所。</p>
    <div class="quote">"声音不会消失。只会变成回声。"</div>
    <p>这句话出现在每一篇报道里。像是某种签名。</p>
    <p>我查了一下 "回声" 这个词的来源。在声学中，回声是声音反射后回到听者耳朵的现象。</p>
    <p>但在这些人的故事里，<span class="hl">回声</span> 似乎意味着别的东西。</p>
    <p style="font-size:13px;color:#6b5f4f;text-align:center;margin-top:12px;text-indent:0;">—— 某种留下来的东西 ——</p>
