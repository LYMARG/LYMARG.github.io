<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件资源管理器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #c0c0c0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        .explorer {
            background: #f0f0f0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            border-radius: 4px;
            width: 100%;
            max-width: 750px;
            box-shadow: 4px 4px 30px rgba(0,0,0,0.3);
        }
        .explorer-header {
            background: #000080;
            color: #fff;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .explorer-header .close {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 0 10px;
            cursor: pointer;
            font-size: 12px;
            color: #000;
            line-height: 20px;
        }
        .explorer-header .close:hover { background: #e0e0e0; }
        .toolbar {
            background: #d0d0d0;
            padding: 4px 8px;
            border-bottom: 1px solid #a0a0a0;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .toolbar .btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 2px 14px;
            cursor: pointer;
            font-size: 12px;
        }
        .toolbar .btn:hover { background: #d5d5d5; }
        .address-bar {
            background: #fff;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 4px 10px;
            font-size: 13px;
            color: #333;
            margin: 6px 10px;
            font-family: 'Courier New', monospace;
        }
        .content {
            padding: 10px;
            min-height: 300px;
        }
        .content .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .content .folder-grid .item {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            text-decoration: none;
            color: #333;
            font-size: 12px;
        }
        .content .folder-grid .item:hover { background: #e8f0ff; border-color: #000080; }
        .content .folder-grid .item .icon { font-size: 32px; display: block; margin-bottom: 4px; }
        .content .folder-grid .item .name { word-wrap: break-word; }
        .content .folder-grid .item .size { font-size: 10px; color: #999; }
        .content .folder-grid .item.locked { opacity: 0.5; cursor: not-allowed; }
        .content .folder-grid .item.locked:hover { background: #fff; border-color: #ddd; }
        .status-bar {
            background: #d0d0d0;
            border-top: 1px solid #a0a0a0;
            padding: 3px 12px;
            font-size: 11px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }
        .page-id {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.08);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
        }
        .nav-links {
            position: fixed;
            bottom: 36px;
            right: 20px;
            display: flex;
            gap: 12px;
            font-size: 12px;
            z-index: 50;
        }
        .nav-links a {
            color: rgba(0,0,0,0.15);
            text-decoration: none;
            font-family: 'Courier New', monospace;
            transition: 0.3s;
        }
        .nav-links a:hover { color: rgba(0,0,0,0.4); }
    </style>
</head>
<body>

<div class="explorer">
    <div class="explorer-header">
        <span>📁 文件资源管理器</span>
        <span class="close" onclick="window.location.href='01_desktop.html'">✕</span>
    </div>
    <div class="toolbar">
        <span class="btn">← 后退</span>
        <span class="btn">→ 前进</span>
        <span class="btn">⬆ 向上</span>
        <span class="btn" style="margin-left:auto;">视图</span>
        <span class="btn">搜索</span>
    </div>
    <div class="address-bar">📌 此电脑 &gt; 本地磁盘 (C:) &gt; Users &gt; 林昭</div>
    <div class="content">
        <div class="folder-grid">
            <a href="08_documents.html" class="item">
                <span class="icon">📁</span>
                <span class="name">我的文档</span>
                <span class="size">12 个项目</span>
            </a>
            <a href="#" class="item" onclick="alert('📁 桌面文件夹')">
                <span class="icon">🖥️</span>
                <span class="name">桌面</span>
                <span class="size">6 个项目</span>
            </a>
            <a href="#" class="item" onclick="alert('📁 下载文件夹')">
                <span class="icon">⬇️</span>
                <span class="name">下载</span>
                <span class="size">3 个项目</span>
            </a>
            <a href="#" class="item" onclick="alert('📁 图片文件夹')">
                <span class="icon">🖼️</span>
                <span class="name">图片</span>
                <span class="size">8 个项目</span>
            </a>
            <a href="#" class="item locked">
                <span class="icon">🔒</span>
                <span class="name">加密文件夹</span>
                <span class="size">🔐 需要密码</span>
            </a>
            <a href="#" class="item" onclick="alert('📁 音乐文件夹')">
                <span class="icon">🎵</span>
                <span class="name">音乐</span>
                <span class="size">2 个项目</span>
            </a>
            <a href="#" class="item" onclick="alert('📁 视频文件夹')">
                <span class="icon">🎬</span>
                <span class="name">视频</span>
                <span class="size">1 个项目</span>
            </a>
            <a href="40_e_drive.html" class="item" style="border-color:#ffd700;background:#fffbe6;">
                <span class="icon">🔒</span>
                <span class="name" style="color:#cc5500;">E: 驱动器</span>
                <span class="size" style="color:#cc5500;">已加密</span>
            </a>
        </div>
        <div style="margin-top:14px;padding:10px;background:#fff8e6;border:1px solid #ffd700;border-radius:4px;font-size:12px;color:#666;">
            💡 提示：<span style="color:#cc5500;">E: 驱动器</span> 已加密。你需要在别处找到密码。
        </div>
    </div>
    <div class="status-bar">
        <span>14 个项目</span>
        <span>可用空间: 18.4 GB</span>
    </div>
</div>

<div class="page-id">[ 03 / 45 ]</div>
<div class="nav-links">
    <a href="02_welcome.html">← 上一页</a>
    <a href="04_recycle.html">下一页 →</a>
</div>

</body>
</html>
