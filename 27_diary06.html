    <div class="title">回声 · 研究所</div>
    <div class="date">2023年9月12日 · 阴</div>

    <p>我找到了这个地方。</p>
    <p>北郊 · 废弃研究所。</p>
    <p>门是锁着的。但侧面有一扇窗户破了。</p>
    <p>我在门口站了很久。里面很黑。</p>
    <p>但我听到了一种声音——<span class="warn">像是有人在说话，但听不清。</span></p>
    <p>也许是风声。也许不是。</p>
    <div class="quote">"我决定明天再来。"</div>
    <p>我拍了一张大门照片。门牌号已经模糊了，但能隐约看到 <span class="hl">"9"</span>。</p>
