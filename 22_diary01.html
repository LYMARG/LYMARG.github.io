    <div class="title">回声 · 开始</div>
    <div class="date">2023年9月1日 · 晴</div>

    <p>今天开学了。大四最后一学期。</p>
    <p>我路过公告栏的时候，看到了一张寻人启事。找的是2018级的一个学长，叫 <span class="hl">陈远</span>。照片已经模糊了，但下面的文字说他是 <span class="hl">声学专业</span> 的。</p>
    <p>我在网上搜了一下这个名字。没有结果。就像这个人从来没有存在过一样。</p>
    <p>但我在一个旧论坛里，看到有人提了一句：<span class="warn">"陈远在2009年失踪了。他当时在研究一个叫'回声'的项目。"</span></p>
    <p>这是我的起点。</p>
