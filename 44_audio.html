<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频播放器 · 录音.wav</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        .player {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 35px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 40px rgba(0,0,0,0.5);
        }
        .player .icon { font-size: 56px; display: block; margin-bottom: 6px; }
        .player .title { color: #ffd700; font-size: 20px; font-weight: 600; letter-spacing: 2px; }
        .player .sub { color: #666; font-size: 13px; margin-top: 2px; }
        .player .divider { border: none; border-top: 1px solid #2a2a2a; margin: 18px 0; }
        .player .info {
            color: #888;
            font-size: 13px;
            line-height: 1.8;
            text-align: left;
            padding: 0 4px;
        }
        .player .info .hl { color: #ffd700; }
        .player audio {
            width: 100%;
            margin: 16px 0;
            background: #0a0a0a;
            border-radius: 4px;
        }
        .player .morse {
            color: #3a7a5a;
            font-size: 24px;
            letter-spacing: 8px;
            padding: 14px;
            border: 1px solid #2a2a2a;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            margin: 12px 0;
            border-radius: 4px;
        }
        .player .morse .hl { color: #ffd700; }
        .player .password-area {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .player .password-area input {
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            padding: 8px 16px;
            font-size: 16px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            width: 140px;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
            border-radius: 4px;
        }
        .player .password-area input:focus { border-color: #ffd700; }
        .player .password-area button {
            background: #2a2a2a;
            border: 2px solid #444;
            color: #fff;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            border-radius: 4px;
            font-family: 'Segoe UI', sans-serif;
        }
        .player .password-area button:hover { background: #3a3a3a; border-color: #ffd700; color: #ffd700; }
        .player .error {
            color: #ff3333;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .player .hint {
            margin-top: 12px;
            font-size: 12px;
            color: #445544;
        }
        .player .hint .hl { color: #6a9a6a; }
        .player .footer {
            margin-top: 16px;
            color: #2a3a2a;
            font-size: 10px;
            border-top: 1px solid #1a2a1a;
            padding-top: 10px;
        }
        .player .footer a {
            color: #3a5a3a;
            text-decoration: none;
        }
        .player .footer a:hover { color: #5a8a5a; }
        .page-id {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.02);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
        }
        .nav-links {
            position: fixed;
            bottom: 36px;
            right: 20px;
            display: flex;
            gap: 12px;
            font-size: 12px;
            z-index: 50;
        }
        .nav-links a {
            color: rgba(255,255,255,0.04);
            text-decoration: none;
            font-family: 'Courier New', monospace;
            transition: 0.3s;
        }
        .nav-links a:hover { color: rgba(255,255,255,0.12); }
        .btn {
            display: inline-block;
            background: transparent;
            border: 1px solid #1a2a1a;
            color: #3a7a5a;
            padding: 4px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            transition: 0.3s;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover { border-color: #4a8a5a; color: #5aaa7a; background: #0a1a0a; }
    </style>
</head>
<body>

<div class="player">
    <span class="icon">🎵</span>
    <div class="title">录音.wav</div>
    <div class="sub">林昭 · 最后一段录音</div>
    <hr class="divider">

    <div class="info">
        📅 录制于: 2023-09-14 23:47<br>
        ⏱️ 时长: 00:45<br>
        📁 大小: 2.0 MB
    </div>

    <audio controls>
        <source src="#" type="audio/wav">
        你的浏览器不支持音频播放。
    </audio>

    <div style="font-size:12px;color:#3a4a3a;margin:-8px 0 8px 0;">
        💡 提示：仔细听最后 10 秒 —— 有 <span class="hl">摩斯电码</span>
    </div>

    <div class="morse">
        <span class="hl">....</span> . .-.. .--.
    </div>

    <div style="font-size:12px;color:#445544;margin:4px 0 8px 0;">
        翻译上面的摩斯电码
    </div>

    <div class="password-area">
        <input type="text" id="morseInput" placeholder="输入答案" maxlength="4" style="letter-spacing:4px;text-transform:uppercase;" onkeydown="if(event.key==='Enter') checkMorse()">
        <button onclick="checkMorse()">验证</button>
    </div>
    <div class="error" id="morseError">❌ 再听听</div>

    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        <a href="43_file3.html" class="btn">← 文件3</a>
        <a href="45_final.html" class="btn" id="finalBtn" style="opacity:0.3;pointer-events:none;">🔒 结局</a>
    </div>

    <div class="footer">
        <a href="40_e_drive.html">← 返回 E: 驱动器</a>
        <span style="color:#1a2a1a;">|</span>
        <a href="01_desktop.html">返回桌面</a>
    </div>
</div>

<script>
    let morseUnlocked = false;

    function checkMorse() {
        const input = document.getElementById('morseInput').value.toUpperCase();
        const error = document.getElementById('morseError');
        const btn = document.getElementById('finalBtn');

        if (input === 'HELP') {
            error.style.display = 'none';
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
            btn.textContent = '▶ 进入结局';
            morseUnlocked = true;
            document.getElementById('morseInput').style.borderColor = '#4a8a5a';
            document.getElementById('morseInput').value = '✅ HELP';
            document.getElementById('morseInput').disabled = true;
        } else {
            error.style.display = 'block';
            document.getElementById('morseInput').value = '';
            document.getElementById('morseInput').focus();
        }
    }
</script>

<div class="page-id">[ 44 / 45 ]</div>
<div class="nav-links">
    <a href="43_file3.html">← 上一页</a>
    <a href="45_final.html">下一页 →</a>
</div>

</body>
</html>
