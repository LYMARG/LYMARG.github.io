<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回收站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #c0c0c0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        .window {
            background: #f0f0f0;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            border-radius: 4px;
            width: 100%;
            max-width: 650px;
            box-shadow: 4px 4px 30px rgba(0,0,0,0.3);
        }
        .win-title {
            background: #000080;
            color: #fff;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .win-title .close {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 0 10px;
            cursor: pointer;
            font-size: 12px;
            color: #000;
            line-height: 20px;
        }
        .win-title .close:hover { background: #e0e0e0; }
        .toolbar {
            background: #d0d0d0;
            padding: 4px 10px;
            border-bottom: 1px solid #a0a0a0;
            font-size: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .toolbar .btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 2px 14px;
            cursor: pointer;
            font-size: 12px;
        }
        .toolbar .btn:hover { background: #d5d5d5; }
        .content { padding: 12px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.15s;
        }
        .file-item:hover { background: #e8f0ff; border-color: #000080; }
        .file-item .icon { font-size: 28px; }
        .file-item .info { flex: 1; }
        .file-item .info .name { font-weight: 500; font-size: 14px; }
        .file-item .info .detail { font-size: 11px; color: #888; }
        .file-item .info .detail .hl { color: #cc5500; }
        .restore-area {
            margin-top: 12px;
            padding: 12px;
            background: #e8f8e8;
            border: 1px solid #80c080;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .restore-area .btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 6px 30px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
            display: inline-block;
        }
        .restore-area .btn:hover { background: #d5d5d5; }
        .restore-area .msg { color: #008000; font-weight: bold; margin-top: 6px; }
        .status-bar {
            background: #d0d0d0;
            border-top: 1px solid #a0a0a0;
            padding: 3px 12px;
            font-size: 11px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }
        .page-id {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,0,0,0.08);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
        }
        .nav-links {
            position: fixed;
            bottom: 36px;
            right: 20px;
            display: flex;
            gap: 12px;
            font-size: 12px;
            z-index: 50;
        }
        .nav-links a {
            color: rgba(0,0,0,0.15);
            text-decoration: none;
            font-family: 'Courier New', monospace;
            transition: 0.3s;
        }
        .nav-links a:hover { color: rgba(0,0,0,0.4); }
    </style>
</head>
<body>

<div class="window">
    <div class="win-title">
        <span>🗑️ 回收站</span>
        <span class="close" onclick="window.location.href='01_desktop.html'">✕</span>
    </div>
    <div class="toolbar">
        <span class="btn" onclick="window.location.href='01_desktop.html'">← 返回桌面</span>
        <span class="btn" onclick="restoreFile()">♻️ 还原</span>
        <span class="btn" style="margin-left:auto;" onclick="alert('⚠️ 此文件被系统保护，无法永久删除。')">🗑️ 彻底删除</span>
    </div>
    <div class="content">
        <div class="file-item" id="fileItem">
            <span class="icon">📄</span>
            <div class="info">
                <div class="name">readme.txt</div>
                <div class="detail">大小: 2.0 KB · 删除日期: 2023-09-14 23:50 · <span class="hl">⚠️ 系统保护文件</span></div>
            </div>
            <span style="font-size:12px;color:#888;">2023-09-14</span>
        </div>

        <div class="restore-area" id="restoreArea">
            <div style="font-size:14px;font-weight:500;">♻️ 文件已还原</div>
            <div class="msg">✅ readme.txt 已还原到桌面</div>
            <span class="btn" onclick="window.location.href='05_restored.html'">📄 查看文件</span>
        </div>

        <div style="margin-top:12px;padding:10px;background:#fff8e6;border:1px solid #ffd700;border-radius:4px;font-size:12px;color:#666;">
            💡 这个文件可能包含重要信息。建议先还原再查看。
        </div>
    </div>
    <div class="status-bar">
        <span>1 个项目 (已删除)</span>
        <span>回收站大小: 2.0 KB</span>
    </div>
</div>

<div class="page-id">[ 04 / 45 ]</div>
<div class="nav-links">
    <a href="03_explorer.html">← 上一页</a>
    <a href="05_restored.html">下一页 →</a>
</div>

<script>
    let restored = false;

    function restoreFile() {
        if (restored) {
            alert('⚠️ 文件已还原，请查看桌面。');
            return;
        }
        restored = true;
        document.getElementById('restoreArea').style.display = 'block';
        document.getElementById('fileItem').style.opacity = '0.3';
        document.getElementById('fileItem').style.cursor = 'default';
        document.getElementById('fileItem').style.pointerEvents = 'none';
        // 通知桌面（通过 localStorage）
        localStorage.setItem('readme_restored', 'true');
    }

    // 检测是否已经还原过
    window.addEventListener('load', function() {
        if (localStorage.getItem('readme_restored') === 'true') {
            restored = true;
            document.getElementById('restoreArea').style.display = 'block';
            document.getElementById('fileItem').style.opacity = '0.3';
            document.getElementById('fileItem').style.cursor = 'default';
            document.getElementById('fileItem').style.pointerEvents = 'none';
        }
    });
</script>

</body>
</html>
