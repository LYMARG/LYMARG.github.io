    <div class="title">回声 · 图书馆</div>
    <div class="date">2023年9月3日 · 阴</div>

    <p>我去图书馆查了旧报纸。</p>
    <p>2009年11月，<span class="hl">北郊声学研究中心发生火灾</span>。一人失踪。失踪者正是陈远。</p>
    <p>报道很短。只有两段。像是被刻意压下来的。</p>
    <p>但我在另一份报纸的夹缝里，看到了一行小字：<span class="warn">"研究项目'回声'或与失踪案有关。"</span></p>
    <p>我把这张报纸复印了。夹在笔记本里。</p>
    <p style="font-size:13px;color:#6b5f4f;text-align:center;margin-top:12px;text-indent:0;">—— 我开始相信这不是意外 ——</p>
