    <div class="header"><span>— 07 —</span><span>第 7 页</span></div>
    <div class="title">回声 · 墙上的字</div>
    <div class="date">2023年9月13日 · 阴</div>

    <p>我进去了。</p>
    <p>窗户比我以为的要大。里面全是灰尘。仪器上盖着布。</p>
    <p>但有一面墙上，有人用指甲刻了一行字：</p>
    <div class="quote">"声音不会消失。只会变成回声。"</div>
    <p>下面还有一行，更小，更用力：</p>
    <div class="quote" style="font-size:14px;color:#6b5f4f;">"2047"</div>
    <p>我站在那里看了很久。</p>
    <p>墙上的字不是一个人刻的。我能看出两种不同的笔迹。</p>
    <p>—— <span class="hl">至少两个人</span> 来过这里，留下了同样的信息。</p>
    <p style="font-size:13px;color:#6b5f4f;text-align:center;margin-top:12px;text-indent:0;">—— 我开始害怕了 ——</p>
